name: Windows build for review
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Verify package
        shell: pwsh
        run: |
          python -m pip install Pillow numpy
          python scripts/check_public.py
          python -m unittest discover -s tests -v
      - name: Install app and builder
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/qt_smoke_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/qt_visual_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build silent tray application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name SPECIMEN.SYS --icon branding/specimen.ico --add-data "specimen_sys/assets;specimen_sys/assets" --add-data "branding;branding" specimen.pyw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/SPECIMEN.SYS -DestinationPath SPECIMEN.SYS-Windows-x64.zip -Force
          (Get-FileHash SPECIMEN.SYS-Windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  SPECIMEN.SYS-Windows-x64.zip" | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Audit compiled application archive
        shell: pwsh
        run: |
          python scripts/audit_release_archive.py SPECIMEN.SYS-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # GitHub Windows service runners have no user's taskbar. Launch the
          # packaged application with offscreen Qt and verify a live process.
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "specimen-appdata"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "specimen-localappdata"
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          $exe = Join-Path $PWD "dist/SPECIMEN.SYS/SPECIMEN.SYS.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw "Packaged EXE exited unexpectedly: $($process.ExitCode)" }
            Write-Host "Packaged EXE live process smoke test: PASS"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Upload build for review
        uses: actions/upload-artifact@v7
        with:
          name: specimen-sys-windows
          path: |
            SPECIMEN.SYS-Windows-x64.zip
            SHA256SUMS.txt
      # Publication is deliberately separated from building and testing.
      # Review the compiled artifact's contents, metadata and runtime first.
      # No GitHub Release is created automatically by this workflow.
