name: Public package checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install Pillow numpy -r requirements.txt
      - name: Public disclosure scan
        run: python scripts/check_public.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Python compile check
        run: python -m compileall -q specimen_sys specimen.pyw
      - name: Headless PySide6 smoke test
        run: python scripts/qt_smoke_test.py
      - name: Windows Qt viewport and equipment plate render audit
        run: python scripts/qt_visual_audit.py
