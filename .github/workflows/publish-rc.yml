name: Publish reviewed Windows release candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rc.yml'
permissions:
  contents: read
jobs:
  publish-candidate:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install Pillow numpy -r requirements.txt "pyinstaller>=6.10,<7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Privacy, unit and Windows offscreen UI tests
        shell: pwsh
        run: |
          python scripts/check_public.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/qt_smoke_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/qt_visual_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name SPECIMEN.SYS --icon branding/specimen.ico --add-data "specimen_sys/assets;specimen_sys/assets" --add-data "branding;branding" specimen.pyw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive, verify and test packaged executable
        shell: pwsh
        run: |
          Compress-Archive -Path dist/SPECIMEN.SYS -DestinationPath SPECIMEN.SYS-Windows-x64.zip -Force
          python scripts/audit_release_archive.py SPECIMEN.SYS-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash SPECIMEN.SYS-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  SPECIMEN.SYS-Windows-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "specimen-candidate-appdata"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "specimen-candidate-localappdata"
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          $process = Start-Process -FilePath (Join-Path $PWD "dist/SPECIMEN.SYS/SPECIMEN.SYS.exe") -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw "Candidate executable exited unexpectedly: $($process.ExitCode)" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Publish verified pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          ## SPECIMEN.SYS v1.6.1, release candidate 2

          Standalone, offline CRT-style Windows biological observation widget with
          Detailed and Classic display modes, layered motion, system tray control,
          a two-second silent startup plate and a borderless About panel.

          **This is a pre-release, not a stable or signed installer.**
          The source and binary passed Windows-hosted unit, offscreen Qt rendering,
          archive disclosure and packaged-process startup checks. Interaction with
          a real Windows desktop, taskbar/tray, multi-monitor arrangements and
          SmartScreen still requires user verification.

          Download **SPECIMEN.SYS-Windows-x64.zip**, extract the entire archive,
          then run **SPECIMEN.SYS.exe** inside the extracted SPECIMEN.SYS folder.
          Do not run the EXE directly from the ZIP.

          The application is an independent, unofficial science-fiction fan project.
          See ASSETS.md for artwork rights and PRIVACY.md for data handling.
          '@ | Set-Content RELEASE-NOTES.md -Encoding utf8
          $tag = "v1.6.1-rc2"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists: $tag. Refusing to overwrite." }
          gh release create $tag SPECIMEN.SYS-Windows-x64.zip SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "SPECIMEN.SYS v1.6.1 | Release Candidate 2" --notes-file RELEASE-NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
